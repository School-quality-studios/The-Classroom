name: ASCHOOL_Visual_Audit_v2
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  optical_verification:
    name: "Perform Visual Audit"
    runs-on: ubuntu-latest
    steps:
      - name: 🔒 ACCESSING_STUDIO_FILES
        uses: actions/checkout@v4

      - name: 🧬 INJECTING_PYTHON_RUNTIME
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🧪 EXECUTING_IMAGE_SCAN_PROTOCOL
        env:
          ISSUE_BODY: ${{ github.event.issue.body || github.event.comment.body }}
          GITHUB_ACTOR: ${{ github.actor }}
        # FIX: Removed "Useless/" because the file is now in the main folder
        run: python Python.py
