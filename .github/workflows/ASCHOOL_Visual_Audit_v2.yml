name: ASCHOOL_Reaction_Audit
on:
  issue_comment:
    types: [created]
  # This triggers the robot whenever you click 👍 or 👎
  reactions:
    types: [created]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  reaction_verification:
    runs-on: ubuntu-latest
    steps:
      - name: 🔒 ACCESSING_FILES
        uses: actions/checkout@v4

      - name: 🧬 INJECTING_PYTHON
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🧪 EXECUTING_REACTION_SCAN
        env:
          # Passes the specific emoji (+1 or -1) to the Python script
          REACTION_TYPE: ${{ github.event.reaction.content }}
        run: python Python.py
